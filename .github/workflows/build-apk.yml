name: Build QuantChat APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            fi
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Release Version Metadata
        id: version
        shell: bash
        run: |
          VERSION_NAME=$(grep '^VERSION_NAME=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep '^VERSION_CODE=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${VERSION_NAME}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Generate debug keystore for CI signing
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Host Vulkan Shader Tools & Android NDK
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libvulkan-dev vulkan-tools
          # Install Android NDK + shaderc/glslc if needed
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          NDK_VERSION="27.2.12479018"
          if [ ! -d "$SDK_ROOT/ndk/$NDK_VERSION" ] && [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --install "ndk;$NDK_VERSION" "cmake;3.31.5" >/dev/null
          fi
          echo "NDK_DIR=$SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build arm64-v8a llama.cpp Vulkan Native Library
        shell: bash
        run: |
          set -euo pipefail
          LLAMA_DIR="/tmp/llama.cpp"
          if [ ! -d "$LLAMA_DIR" ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$LLAMA_DIR"
          fi

          # Ensure glslc from Android NDK shaderc or system is on PATH
          SHADERC_BIN_DIR="$(dirname "$(find "$NDK_DIR/shader-tools" -name glslc -type f 2>/dev/null | head -n 1 || true)")"
          if [ -n "$SHADERC_BIN_DIR" ] && [ -d "$SHADERC_BIN_DIR" ]; then
            export PATH="$SHADERC_BIN_DIR:$PATH"
          fi
          which glslc

          cmake -S engine-vulkan/src/main/cpp -B /tmp/vulkan-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_DIR}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CPP_DIR="$LLAMA_DIR"
          cmake --build /tmp/vulkan-arm64 --target quantchat_vulkan -j"$(nproc)"

          mkdir -p engine-vulkan/src/main/jniLibs/arm64-v8a
          cp /tmp/vulkan-arm64/libquantchat_vulkan.so engine-vulkan/src/main/jniLibs/arm64-v8a/libquantchat_vulkan.so
          ls -lh engine-vulkan/src/main/jniLibs/arm64-v8a/libquantchat_vulkan.so

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Stage Debug APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/QuantChat-${RELEASE_TAG}-debug.apk"

      - name: Build Signed Release APK (if keystore secrets exist)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "dist/QuantChat-${RELEASE_TAG}-release.apk"
            rm -f "$KEYSTORE_PATH"
          else
            echo "Release keystore secrets not configured; skipping release APK."
          fi

      - name: Generate Checksums & Release Notes
        shell: bash
        run: |
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path

          ver_name = os.environ["VERSION_NAME"]
          ver_code = os.environ["VERSION_CODE"]
          tag = os.environ["RELEASE_TAG"]
          sha = os.environ.get("GITHUB_SHA", "")[:7]
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          changelog_path = Path("CHANGELOG.md")
          section = ""
          if changelog_path.exists():
              text = changelog_path.read_text(encoding="utf-8")
              pattern = rf"(## {re.escape(tag)}.*?)(?=\n## v|\Z)"
              m = re.search(pattern, text, flags=re.S)
              if m:
                  section = m.group(1).strip()

          prev_tag = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "--exclude", tag, "--exclude", "latest"],
              capture_output=True, text=True
          ).stdout.strip()

          log_range = f"{prev_tag}..HEAD" if prev_tag else "-n 10"
          cmd = ["git", "log", "--no-merges", "--pretty=format:- `%h` %s (%an)"]
          if prev_tag:
              cmd.append(log_range)
          else:
              cmd.extend(["-n", "10"])
          commits = subprocess.run(cmd, capture_output=True, text=True).stdout.strip()

          sums = Path("dist/SHA256SUMS.txt").read_text(encoding="utf-8").strip()

          lines = [
              f"# QuantChat {tag}",
              "",
              "| Field | Value |",
              "|---|---|",
              f"| Version | `{ver_name}` (Build `{ver_code}`) |",
              f"| Commit | `{sha}` |",
              "| Android SDK | Min API 24 / Target API 36 |",
              "| Native Engine | `llama.cpp` CPU (`llamacpp-kotlin 0.4.0`, `arm64-v8a`/`x86_64`) + Vulkan GPU (`arm64-v8a`, auto CPU fallback) |",
              "",
          ]
          if section:
              lines.extend([section, ""])
          if commits:
              title = f"### Commits Since `{prev_tag}`" if prev_tag else "### Recent Commits"
              lines.extend([title, commits, ""])
          lines.extend(["### SHA-256 Checksums", "```", sums, "```", ""])
          if repo and prev_tag:
              lines.append(f"**Compare**: https://github.com/{repo}/compare/{prev_tag}...{tag}")

          Path("dist/RELEASE_NOTES.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantChat-${{ env.RELEASE_TAG }}-APK
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publish Formal Versioned Release to GitHub Releases
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: QuantChat ${{ env.RELEASE_TAG }}
          prerelease: false
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
